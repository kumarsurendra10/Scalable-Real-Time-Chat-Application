version: "3.9"

x-app-common: &app-common
  build: .
  env_file: .env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment:
    DATABASE_URL: postgresql+asyncpg://chat_user:chat_pass@postgres:5432/chatdb
    REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chat_user
      POSTGRES_PASSWORD: chat_pass
      POSTGRES_DB: chatdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_user -d chatdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  # Three replicas of the SAME app image -> demonstrates horizontal
  # scaling. A WebSocket opened on app2 still receives messages sent
  # by a user connected to app1, because fan-out goes through Redis
  # pub/sub instead of in-process memory.
  app1:
    <<: *app-common
    environment:
      DATABASE_URL: postgresql+asyncpg://chat_user:chat_pass@postgres:5432/chatdb
      REDIS_URL: redis://redis:6379/0
      INSTANCE_ID: app-1

  app2:
    <<: *app-common
    environment:
      DATABASE_URL: postgresql+asyncpg://chat_user:chat_pass@postgres:5432/chatdb
      REDIS_URL: redis://redis:6379/0
      INSTANCE_ID: app-2

  app3:
    <<: *app-common
    environment:
      DATABASE_URL: postgresql+asyncpg://chat_user:chat_pass@postgres:5432/chatdb
      REDIS_URL: redis://redis:6379/0
      INSTANCE_ID: app-3

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app1
      - app2
      - app3
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:80"

volumes:
  pgdata:
