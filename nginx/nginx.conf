events {
    worker_connections 1024;
}

http {
    # ip_hash keeps a given client's WebSocket connection pinned to the
    # same replica for the lifetime of that connection, while still
    # spreading NEW connections across all 3 replicas. Since real-time
    # fan-out happens via Redis pub/sub (not in-process memory), sticky
    # sessions here are a nice-to-have for connection stability, not a
    # correctness requirement -- messages route correctly even without it.
    upstream chat_backend {
        ip_hash;
        server app1:8000;
        server app2:8000;
        server app3:8000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://chat_backend;
            proxy_http_version 1.1;

            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # WebSockets are long-lived; don't let nginx time them out
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /health {
            proxy_pass http://chat_backend/health;
        }
    }
}
